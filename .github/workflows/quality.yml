name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check first-party license headers
        run: ./scripts/check-license-headers.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: firewall_manager_test
          POSTGRES_USER: firewall
          POSTGRES_PASSWORD: firewall-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firewall -d firewall_manager_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.1-alpine3.22@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENVIRONMENT: test
      FPM_TEST_DATABASE_URL: postgresql+psycopg://firewall:firewall-test-only@localhost:5432/firewall_manager_test
      DATABASE_URL: postgresql+psycopg://firewall:firewall-test-only@localhost:5432/firewall_manager_test
      REDIS_URL: redis://localhost:6379/15
      FMC_BASE_URL: http://mock-fmc.invalid
      SCC_BASE_URL: http://mock-scc.invalid
      DEV_AUTH_ENABLED: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Format and lint
        run: ruff format --check backend && ruff check backend
      - name: Type check
        working-directory: backend
        run: pyright
      - name: Migrate test database
        working-directory: backend
        run: alembic upgrade head
      - name: Test
        working-directory: backend
        run: pytest
      - name: Architecture boundaries
        working-directory: backend
        run: lint-imports --config importlinter.ini
      - name: Migration and repeatable seed
        working-directory: backend
        run: alembic upgrade head && python -m firewall_manager.seed && python -m firewall_manager.seed && alembic check
      - name: OpenAPI contract is current
        run: python -m firewall_manager.export_openapi openapi.json && git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Generated API types are current
        working-directory: frontend
        run: npm run api:generate && git diff --exit-code -- src/api/schema.d.ts
      - name: Format, lint, and type check
        working-directory: frontend
        run: npm run format:check && npm run lint && npm run typecheck
      - name: Component and accessibility tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Dependency audits
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
          pip-audit -r backend/requirements.lock
          pip-audit -r backend/requirements-dev.lock
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high
      - name: SAST
        run: python -m pip install semgrep==1.177.0 && semgrep scan --config .semgrep.yml --error
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build images
        run: docker build -t firewall-manager-backend:test backend && docker build -f frontend/Dockerfile.production -t firewall-manager-frontend:test frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: firewall-manager-backend:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: firewall-manager-frontend:test
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Remove test images
        if: always()
        run: |
          for image in firewall-manager-backend:test firewall-manager-frontend:test; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm --force "$image"
            fi
          done

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start and verify canonical local stack
        run: cp .env.example .env && ./scripts/smoke.sh
      - name: Collect logs
        if: failure()
        run: |
          docker compose --project-name firewall-manager-local ps
          docker compose --project-name firewall-manager-local logs --tail=300
      - name: Stop local stack
        if: always()
        run: |
          docker compose --project-name firewall-manager-local down --volumes --remove-orphans --rmi local
          ./scripts/docker-cleanup.sh --volumes
