groups:
  - name: firewall-manager
    rules:
      - alert: FirewallManagerApiNotReady
        expr: up{job="firewall-manager-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Firewall Policy Manager API is not ready
          description: The API has failed readiness checks for more than two minutes.
      - alert: FirewallManagerApiErrors
        expr: sum(rate(firewall_manager_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Firewall Policy Manager API errors elevated
      - alert: FirewallManagerRateLimited
        expr: sum(rate(firewall_manager_http_requests_total{status="429"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Firewall Policy Manager API rate limiting is active
      - alert: FirewallManagerWorkerHeartbeatStale
        expr: firewall_manager_worker_healthy == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Firewall Policy Manager worker heartbeat is stale
      - alert: FirewallManagerSchedulerHeartbeatStale
        expr: firewall_manager_scheduler_healthy == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Firewall Policy Manager scheduler heartbeat is stale
