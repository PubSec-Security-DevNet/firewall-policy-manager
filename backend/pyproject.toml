[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firewall-manager"
dynamic = ["version"]
description = "Delegated Cisco Secure Firewall control plane"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.0",
  "cryptography==50.0.1",
  "dramatiq[redis]==2.2.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-json-logger==3.3.0",
  "redis==8.1.0",
  "sqlalchemy==2.0.54",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
  "import-linter==2.15",
  "pip-audit==2.10.1",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.setuptools.dynamic]
version = {attr = "firewall_manager.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_provider: explicitly opted-in, non-production, read-only Cisco compatibility test",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "DTZ", "E", "F", "FAST", "I", "N", "PERF", "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "T20", "UP"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"alembic/versions/*.py" = ["E501", "PLR0915"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportArgumentType = "none"
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportGeneralTypeIssues = "none"
reportIncompatibleMethodOverride = "none"
reportOptionalMemberAccess = "none"
reportPossiblyUnboundVariable = "none"
reportReturnType = "none"
venvPath = "."
venv = ".venv"
