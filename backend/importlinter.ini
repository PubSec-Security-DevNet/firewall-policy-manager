[importlinter]
root_package = firewall_manager
include_external_packages = True

[importlinter:contract:domain-independent]
name = Domain does not depend on frameworks or infrastructure
type = forbidden
source_modules =
    firewall_manager.domain
forbidden_modules =
    fastapi
    sqlalchemy
    firewall_manager.api
    firewall_manager.persistence
    firewall_manager.providers
    firewall_manager.worker

[importlinter:contract:api-no-concrete-provider]
name = API does not call concrete providers
type = forbidden
source_modules =
    firewall_manager.api
forbidden_modules =
    firewall_manager.providers.fmc
    firewall_manager.providers.scc

[importlinter:contract:application-no-interface]
name = Application services do not depend on interfaces
type = forbidden
source_modules =
    firewall_manager.application
forbidden_modules =
    firewall_manager.api
    firewall_manager.worker
    firewall_manager.mock_provider
